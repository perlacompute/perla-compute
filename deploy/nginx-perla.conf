# Replace perla.example.com with your actual domain; change 3109 if configured.
# Install TLS using your existing certificate/Certbot workflow before wallet use.
server {
    listen 80;
    server_name perla.example.com;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:3109;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}
