name: Feature request
description: Suggest a concrete improvement to Perla.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the task or limitation this change would address.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Explain the expected behavior and any alternative you considered.
    validations:
      required: true
