name: Testnet release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Check tag matches package version
        run: node -e 'if(process.env.GITHUB_REF_NAME!=="v"+require("./package.json").version)process.exit(1)'
      - run: npm ci --no-audit --no-fund
      - run: npm run package:mining
      - run: npm run check
      - run: npm run build
      - run: npm run typecheck
      - run: node scripts/checks/vps-http.test.mjs
      - name: Package tracked public source
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix=perla-compute/ HEAD > release/perla-compute-source.tar.gz
          cp public/downloads/*.tar.gz release/
          npm sbom --sbom-format cyclonedx > release/sbom.cdx.json
          cd release
          sha256sum *.tar.gz sbom.cdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perla-testnet-release
          path: release/
          if-no-files-found: error
      - name: Create draft release for operator review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --title "Perla $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
      # No wallet key, chain deployment, funding or mining admission step exists.
